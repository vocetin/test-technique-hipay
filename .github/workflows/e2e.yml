name: E2E Tests — HiPay Fraud Management

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual trigger with optional tag filter
  workflow_dispatch:
    inputs:
      tags:
        description: 'Test tags to run (e.g. @smoke, @regression, @critical)'
        required: false
        default: '@smoke'

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Job 2: Smoke Tests (runs on every push + PR, blocks merge) ─────────────
  e2e-smoke:
    name: Smoke Tests (@smoke)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: true

      - name: Upload Allure results (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-smoke
          path: output/
          retention-days: 3

  # ── Job 3: Full Regression (runs on push to main/develop only) ─────────────
  e2e-regression:
    name: Full Regression (@regression)
    runs-on: ubuntu-latest
    needs: e2e-smoke
    # Full regression is expensive — skip on PR, run on push and manual dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run regression suite
        run: |
          TAGS="${{ github.event.inputs.tags || '@regression' }}"
          npx codeceptjs run --features --grep "$TAGS" --reporter min
        env:
          CI: true

      - name: Upload Allure results (regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression
          path: allure-results/
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-regression
          path: output/
          retention-days: 5

  # ── Job 4: Generate Allure HTML report ────────────────────────────────────
  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [e2e-smoke, e2e-regression]
    # Always generate a report, even if tests fail
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (required by allure-commandline)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download smoke Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
        continue-on-error: true

      - name: Download regression Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression
          path: allure-results/
        continue-on-error: true

      - name: Generate Allure HTML report
        run: npm run report:generate

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30
