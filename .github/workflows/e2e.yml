name: E2E Tests — HiPay Fraud Management

on:
  push:
    branches: [main, develop, test-technique]
  pull_request:
    branches: [main, develop, test-technique]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Test tags to run (e.g. @smoke, @regression)'
        required: false
        default: '@smoke'

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  e2e-smoke:
    name: Smoke Tests — Chrome
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: true
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
          retention-days: 7
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-smoke
          path: output/
          retention-days: 3

  e2e-regression:
    name: Regression — Chrome + Mobile + Safari
    runs-on: ubuntu-latest
    needs: e2e-smoke
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run regression suite (cross-browser)
        run: |
          TAGS="${{ github.event.inputs.tags || '@regression' }}"
          npx codeceptjs run-multiple chrome mobile safari --features --grep "$TAGS" --reporter min
        env:
          CI: true
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression
          path: allure-results/
          retention-days: 14
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-regression
          path: output/
          retention-days: 5

  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [e2e-smoke, e2e-regression]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Download smoke results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results/
        continue-on-error: true
      - name: Download regression results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-regression
          path: allure-results/
        continue-on-error: true
      - run: npm run report:generate
      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30

  deploy-pages:
    name: Deploy Report to GitHub Pages
    runs-on: ubuntu-latest
    needs: allure-report
    if: always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure HTML report
        uses: actions/download-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
